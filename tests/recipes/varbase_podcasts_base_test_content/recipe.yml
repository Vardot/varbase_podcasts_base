name: 'Varbase Podcasts Base Test Content'
description: 'Testing-only content for the Varbase Podcasts Base functional testing suite. Creates 15 published example podcast episodes that share one tag and one cover-art media item — 12 referencing one uploaded Audio media item and 3 with no audio at all — so the listing, result-summary, exposed-filter, pager, related-episodes and audio scenarios have deterministic data to assert against. Applied only by the test pipeline — not for production sites.'
type: 'Content'
